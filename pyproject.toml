[project]
name = "rag-local-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dalceeee", email = "s342631@studenti.polito.it" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastparquet>=2026.9.0",
    "langchain>=1.4.3",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.3",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "scipy<1.18",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
rag-local-lab = "rag_local_lab:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
